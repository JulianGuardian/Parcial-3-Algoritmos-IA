services:
  backend:
    build:
      context: ./backend
    image: nubara-backend:dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Source is mounted so edits are picked up without rebuilding the image.
      - ./backend/app:/app/app
    # Overrides the image CMD to add reload. Plain uvicorn uses a polling
    # reloader, which also works on Windows bind mounts.
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --no-access-log
      - --reload
      - --reload-dir=/app/app

  frontend:
    build:
      context: ./frontend
    image: nubara-frontend:dev
    ports:
      - "5173:5173"
    environment:
      # File events do not cross a Windows bind mount, so Vite polls for changes.
      VITE_USE_POLLING: "true"
    volumes:
      # Sources are mounted so edits reload the page without rebuilding the image.
      - ./frontend:/app
      # The container keeps its own node_modules: the host's contain binaries built for another platform.
      - frontend_node_modules:/app/node_modules
    # Installs first so a changed lockfile takes effect on restart (the volume does not follow image
    # rebuilds), then replaces the shell with Vite so it receives the stop signal.
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile && exec pnpm run dev --host 0.0.0.0 --port 5173 --strictPort

volumes:
  frontend_node_modules:
