[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nubara-backend"
version = "0.1.0"
description = "Backend for the Nubara Airlines flight-modification assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "google-adk==2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.disruption.fixtures" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: real-model evaluation case (change build-disruption-agent, task 5.2); needs INTENT_MODEL_API_KEY, run explicitly with `pytest evals -m llm`",
]
